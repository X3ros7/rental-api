openapi: 3.0.3
info:
  title: Housing Rental API
  version: 1.0.0
  description: REST API for managing rental properties and tenants.

servers:
  - url: http://localhost:8000/api/v1
    description: Local development server

tags:
  - name: Properties
    description: Rental property management
  - name: Tenants
    description: Tenant management

security:
  - BearerAuth: []

paths:
  /properties:
    get:
      tags:
        - Properties
      summary: Get all properties
      operationId: getProperties
      security: []
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
          example: Bucharest
        - name: available
          in: query
          required: false
          schema:
            type: boolean
        - name: maxPrice
          in: query
          required: false
          schema:
            type: number
            format: double
            minimum: 0
      responses:
        "200":
          description: Properties retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"
              example:
                - id: 1
                  title: Modern Apartment
                  address: 10 Example Street
                  city: Bucharest
                  pricePerMonth: 650
                  bedrooms: 2
                  available: true
                  tenantId: null
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags:
        - Properties
      summary: Create a property
      operationId: createProperty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyInput"
            example:
              title: Modern Apartment
              address: 10 Example Street
              city: Bucharest
              pricePerMonth: 650
              bedrooms: 2
              available: true
      responses:
        "201":
          description: Property created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /properties/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"

    get:
      tags:
        - Properties
      summary: Get a property by ID
      operationId: getPropertyById
      security: []
      responses:
        "200":
          description: Property retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Properties
      summary: Update a property
      operationId: updateProperty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyInput"
      responses:
        "200":
          description: Property updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

    delete:
      tags:
        - Properties
      summary: Delete a property
      operationId: deleteProperty
      responses:
        "204":
          description: Property deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /tenants:
    get:
      tags:
        - Tenants
      summary: Get all tenants
      operationId: getTenants
      security: []
      responses:
        "200":
          description: Tenants retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
              example:
                - id: 1
                  firstName: Ivan
                  lastName: Petrov
                  email: ivan@example.com
                  phone: "+40712345678"
                  propertyId: 1
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags:
        - Tenants
      summary: Create a tenant
      operationId: createTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantInput"
            example:
              firstName: Ivan
              lastName: Petrov
              email: ivan@example.com
              phone: "+40712345678"
              propertyId: 1
      responses:
        "201":
          description: Tenant created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /tenants/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"

    get:
      tags:
        - Tenants
      summary: Get a tenant by ID
      operationId: getTenantById
      security: []
      responses:
        "200":
          description: Tenant retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Tenants
      summary: Update a tenant
      operationId: updateTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantInput"
      responses:
        "200":
          description: Tenant updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

    delete:
      tags:
        - Tenants
      summary: Delete a tenant
      operationId: deleteTenant
      responses:
        "204":
          description: Tenant deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Unique resource identifier
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

  schemas:
    Property:
      type: object
      required:
        - id
        - title
        - address
        - city
        - pricePerMonth
        - bedrooms
        - available
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        title:
          type: string
          example: Modern Apartment
        address:
          type: string
          example: 10 Example Street
        city:
          type: string
          example: Bucharest
        pricePerMonth:
          type: number
          format: double
          minimum: 0
          example: 650
        bedrooms:
          type: integer
          minimum: 0
          example: 2
        available:
          type: boolean
          example: true
        tenantId:
          type: integer
          format: int64
          nullable: true
          example: null

    PropertyInput:
      type: object
      required:
        - title
        - address
        - city
        - pricePerMonth
        - bedrooms
        - available
      properties:
        title:
          type: string
        address:
          type: string
        city:
          type: string
        pricePerMonth:
          type: number
          format: double
          minimum: 0
        bedrooms:
          type: integer
          minimum: 0
        available:
          type: boolean
        tenantId:
          type: integer
          format: int64
          nullable: true

    Tenant:
      type: object
      required:
        - id
        - firstName
        - lastName
        - email
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        firstName:
          type: string
          example: Ivan
        lastName:
          type: string
          example: Petrov
        email:
          type: string
          format: email
          example: ivan@example.com
        phone:
          type: string
          nullable: true
          example: "+40712345678"
        propertyId:
          type: integer
          format: int64
          nullable: true
          example: 1

    TenantInput:
      type: object
      required:
        - firstName
        - lastName
        - email
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        propertyId:
          type: integer
          format: int64
          nullable: true

    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Resource not found

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: Invalid request

    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: Authentication required

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: Resource not found

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: Email address is invalid

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: Internal server error
